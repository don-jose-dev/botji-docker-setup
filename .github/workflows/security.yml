name: Security scans

# Foundation security gate: gitleaks for secrets in code, trivy for vulns in
# the built image. Both jobs are non-blocking for the deploy workflow (they
# run independently) but PR-blocking on findings — see docs/SECURITY.md for the
# runbook when one fires.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  # Weekly catch-all so a new CVE in the base image surfaces even if nobody
  # touched the repo.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action posts a check-run summary; needs pull-requests write
      # when triggered from a PR.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the PR head.
          # gitleaks-action does its own diff selection in PR mode (only new
          # commits) — fetch-depth: 0 is what lets it walk the base ref.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the project-local config (allowlist for known-public values).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Fail the job on any unredacted finding (default behavior; explicit
          # for clarity).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  trivy-image:
    name: trivy (image vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        # We scan a freshly-built image rather than reaching into GHCR so PRs
        # from forks (which lack registry write) still get scanned. The deploy
        # workflow handles the actual push.
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: botji-hermes:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: botji-hermes:scan
          format: sarif
          output: trivy-results.sarif
          # Block on HIGH+CRITICAL; warn on the rest. Per-CVE waivers live in
          # .trivyignore with a justification comment.
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: "os,library"

      - name: Upload trivy results to GitHub Security
        # Surfaces findings in the repo's Security tab. Runs even on failure so
        # blocked PRs still report the offending CVE list.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Upload trivy results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results
          path: trivy-results.sarif
          retention-days: 30

  trivy-fs:
    name: trivy (filesystem + IaC scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run trivy on repo (config + secrets + misconfig)
        # Filesystem scan catches Dockerfile misconfigurations and
        # IaC issues (compose, GitHub Actions) before they ship. Secret scan
        # here is a backstop — gitleaks is the primary.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          # FS scan is informational for now (do not gate PRs on Dockerfile
          # misconfigs that we have not triaged yet). Flip to exit-code: "1"
          # once the baseline is clean.
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload trivy fs results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Upload trivy fs results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results
          path: trivy-fs-results.sarif
          retention-days: 30
