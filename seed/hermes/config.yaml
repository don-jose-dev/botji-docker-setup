model:
  default: gpt-5.5
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
terminal:
  backend: local
  cwd: .
  timeout: 180
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  # threshold 0.50: compress at 50% (136K tokens) rather than 65% (177K).
  # With image_input_mode:native, images re-attach fresh each turn so there is no
  # reason to keep a bloated context alive to "preserve image context" — the model
  # can see the source image directly. Compressing earlier means the compressor LLM
  # call processes ~136K tokens instead of ~177K, saving ~30s per compression event.
  # target_ratio 0.35: keep 35% (95K) instead of 20% (54K). Less aggressive summary
  # = faster compressor = less information lost on active image-edit threads.
  # protect_last_n 20: trim from 30 so accumulated vision_analyze outputs (162K chars
  # each) get summarised away before they push context past the threshold again.
  threshold: 0.50
  target_ratio: 0.35
  # protect_last_n 14: the compressor tail budget = threshold × target_ratio =
  # 136K × 0.35 = 47.6K tokens. But protect_last_n is the MINIMUM message count.
  # At 8, the 8 most-recent messages only total ~25K tokens — the agent wakes up
  # after compression with no memory of which skills it already read and immediately
  # calls skill_view 3-4× (15K chars each), consuming 44% of post-compression
  # budget before any work starts. 2 image-pipeline turns later context is back at
  # 136K and fires again.
  # At 14, the protected tail includes skill_view outputs from the previous 2 turns,
  # the agent recognises it already read those skills, skips re-reads, and compression
  # fires 2-3× less often. 14 messages × ~3K tokens avg = ~42K retained — aligns
  # with the 47.6K token tail budget.
  protect_last_n: 14
  protect_first_n: 3
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: codex
    model: gpt-5.5
    timeout: 120
    download_timeout: 30
  web_extract:
    provider: codex
    model: gpt-5.5
  session_search:
    provider: codex
    model: gpt-5.5
    timeout: 60
    max_concurrency: 2
  compression:
    provider: codex
    model: gpt-5.5
memory:
  memory_enabled: true
  user_profile_enabled: true
  # Caps bumped after 48h VPS audit showed user_char_limit:1375 hitting
  # "Memory at N/1375 — would exceed the limit" 3× in 2 days for active users
  # (don_jose hit 1370/1375). 2750/3300 gives ~2× headroom while staying well
  # under any reasonable token budget when injected into the system prompt.
  memory_char_limit: 3300
  user_char_limit: 2750
  nudge_interval: 10
  flush_min_turns: 6
session_reset:
  mode: both
  # idle_minutes 45: sessions grow to 1.2 MB within hours during active image work.
  # Users who pause for >45 min get a clean session on return; active users never
  # hit this threshold (they send follow-ups every few minutes). Artifacts are
  # persisted to disk so no work is lost — the new session can still reference prior
  # artifact IDs. Daily reset at 4am clears anything that accumulated overnight.
  idle_minutes: 45
  at_hour: 4
group_sessions_per_user: true
streaming:
  enabled: true
skills:
  creation_nudge_interval: 15
agent:
  max_turns: 60
  verbose: false
  reasoning_effort: medium
  # Force native vision attachment on user-attached images. gpt-5.5 is
  # multimodal (models.dev supports_vision=True for openai-codex/gpt-5.5);
  # without this, auxiliary.vision.provider being set causes the auto router to
  # short-circuit into text mode (vision_analyze pre-pass). Native mode skips
  # the ~7 s describe step and sends pixels straight to the chat model,
  # eliminating the describe-drift fidelity loss that triggered the
  # "layout present / layout missing" contradictions in earlier reviews.
  # Trade-off: prompt cache misses on image-carrying turns (text follow-ups
  # in the same session still cache). If you switch to a non-vision chat
  # model, set this back to "auto" so routing falls back to text gracefully.
  image_input_mode: native
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: "You are a kawaii assistant! Use cute expressions like (\u25D5\u203F\u25D5\
      ), \u2605, \u266A, and ~! Add sparkles and be super enthusiastic about everything!\
      \ Every response should feel warm and adorable desu~! \u30FD(>\u2200<\u2606\
      )\u30CE"
    catgirl: "You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and\
      \ cat-like expressions to your speech. Use kaomoji like (=^\uFF65\u03C9\uFF65\
      ^=) and \u0E05^\u2022\uFECC\u2022^\u0E05. Be playful and curious like a cat,\
      \ nya~!"
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: "Duuude! You're chatting with the chillest AI on the web, bro! Everything's\
      \ gonna be totally rad. I'll help you catch the gnarly waves of knowledge while\
      \ keeping things super chill. Cowabunga! \U0001F919"
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: "YOOO LET'S GOOOO!!! \U0001F525\U0001F525\U0001F525 I am SO PUMPED to help\
      \ you today! Every question is AMAZING and we're gonna CRUSH IT together! This\
      \ is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! \U0001F4AA\U0001F624\
      \U0001F680"
platform_toolsets:
  cli:
  - hermes-cli
  telegram:
  - hermes-telegram
  discord:
  - hermes-discord
  whatsapp:
  - hermes-whatsapp
  slack:
  - hermes-slack
  signal:
  - hermes-signal
  homeassistant:
  - hermes-homeassistant
  qqbot:
  - hermes-qqbot
  yuanbao:
  - hermes-yuanbao
  teams:
  - hermes-teams
  google_chat:
  - hermes-google_chat
image_gen:
  provider: botji-codex   # botji-render registers this provider
  model: gpt-image-2-high
  openai-codex:
    model: gpt-image-2-high
plugins:
  enabled:
  - botji-artifacts   # bookkeeping (register/extract/normalize/list/read) + legacy review
  - botji-allowlist   # file-backed Telegram allowlist with hot reload
  - botji-gate        # Default-FAIL delivery gate (transform_llm_output)
  - observability/langfuse  # active only when HERMES_LANGFUSE_PUBLIC_KEY is set
  # botji-render removed 2026-05-19: broken plugin (bad import + missing 'images' attr).
  # Image generation flows through artifact_transform.edit_image.openai_codex instead.
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
code_execution:
  timeout: 600
  max_tool_calls: 50
delegation:
  max_iterations: 50
display:
  compact: true
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  busy_input_mode: interrupt
  background_process_notifications: all
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
approvals:
  destructive_slash_confirm: false
onboarding:
  seen:
    busy_input_prompt: true
