name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - logs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: don-jose-dev/botji-hermes

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  logs:
    name: Fetch container logs
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'
    permissions:
      contents: read

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch logs
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          $SSH "$HOST" "docker logs botji-hermes --tail 200 2>&1"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event.inputs.action == 'deploy')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Write CI vars file
        run: |
          {
            echo "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'"
            echo "GHCR_USER='${{ github.actor }}'"
            echo "IMAGE_REF='ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}'"
            echo "GIT_BRANCH='${{ github.ref_name }}'"
            echo "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'"
          } > /tmp/ci-vars.env
          printf '%s' "${{ secrets.VPS_ENV }}" | base64 > /tmp/vps-env.b64

      - name: Deploy via SSH
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          # Copy files to server
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/vps-deploy.sh /tmp/ci-vars.env /tmp/vps-env.b64 \
            "$HOST:/tmp/"

          # Run deploy
          $SSH "$HOST" "chmod +x /tmp/vps-deploy.sh && bash /tmp/vps-deploy.sh"
