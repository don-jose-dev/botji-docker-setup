id: vocab_reject_bad_element_id
description: |
  Pydantic rejects an element_id that is not kebab-style snake_case.
  Camel case, hyphens, uppercase, leading digits — all rejected by the
  field_validator. element_id stability is what lets review compare typed
  rows across attempts; ad-hoc IDs break that contract.
inputs:
  scenario: pydantic_validate
  typed_manifest:
    version: v2
    scene_type: kitchen_interior
    source_modality: sketch
    elements:
      - element_id: Counter-Top_01
        type: countertop
        zone: back_wall
        required: true
        status: visible
        evidence: ""
    adjacency_constraints: []
    opening_constraints: []
    layout_hints: []
    fidelity_requirements: []
expected:
  pydantic_valid: false
  failing_field_contains: element_id
