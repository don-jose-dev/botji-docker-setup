name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - logs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: don-jose-dev/botji-hermes

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  logs:
    name: Fetch container logs
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'
    permissions:
      contents: read

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch logs
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          echo "=== CONTAINER STARTUP + RECENT LOGS (last 100 lines) ==="
          $SSH "$HOST" "docker logs botji-hermes --tail 100 --timestamps 2>&1"
          echo ""

          echo "=== GATEWAY LOG — last 200 lines (user messages, step timing) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'tail -200 /opt/data/logs/gateway.log 2>/dev/null || echo GATEWAY_LOG_MISSING'"
          echo ""

          echo "=== AGENT LOG — last 300 lines (tool calls, step durations) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'tail -300 /opt/data/logs/agent.log 2>/dev/null || echo AGENT_LOG_MISSING'"
          echo ""

          echo "=== ERRORS LOG — last 50 lines ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'tail -50 /opt/data/logs/errors.log 2>/dev/null || echo ERRORS_LOG_MISSING'"
          echo ""

          echo "=== ARTIFACT INDEX (all records: model, route, timing) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'cat /opt/data/artifacts/index/artifacts.jsonl 2>/dev/null | python3 -c \"
import sys, json
for line in sys.stdin:
    line = line.strip()
    if not line: continue
    r = json.loads(line)
    print(json.dumps({
        k: r.get(k) for k in [
            'artifact_id','role','adapter','created_at',
            'model','chat_model','provider','route','contract_id',
            'quality','size','sha256','size_bytes','parents'
        ]
    }, default=str))
\" 2>/dev/null || cat /opt/data/artifacts/index/artifacts.jsonl 2>/dev/null | tail -30'"
          echo ""

          echo "=== LATEST 5 EVIDENCE FILES (step durations, tool calls) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'find /opt/data/artifacts/evidence -name \"*.json\" -printf \"%T@ %p\\n\" 2>/dev/null | sort -n | tail -5 | cut -d\" \" -f2- | while read f; do echo \"--- \$f ---\"; cat \"\$f\" 2>&1 | python3 -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps({k: d.get(k) for k in [\\\"evidence_id\\\",\\\"extractor\\\",\\\"claim_level\\\",\\\"summary\\\",\\\"created_at\\\"]}, default=str))\"; echo; done'"
          echo ""

          echo "=== LATEST 3 REVIEWS (verdict + key axes) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'find /opt/data/artifacts/reviews -name \"*.json\" -printf \"%T@ %p\\n\" 2>/dev/null | sort -n | tail -3 | cut -d\" \" -f2- | while read f; do echo \"--- \$f ---\"; cat \"\$f\" 2>&1 | python3 -c \"
import sys,json
d=json.load(sys.stdin)
print(\\\"verdict:\\\", d.get(\\\"verdict\\\"))
print(\\\"contract_id:\\\", d.get(\\\"contract_id\\\"))
print(\\\"output_ref:\\\", d.get(\\\"reviewed_output_ref\\\"))
for ax in d.get(\\\"axes\\\",[]):
    sev = ax.get(\\\"severity\\\",\\\"none\\\")
    if sev in (\\\"blocking\\\",\\\"medium\\\") or ax.get(\\\"compare_status\\\") in (\\\"conflict\\\",\\\"partial\\\"):
        print(\\\"  AX\\\", ax[\\\"axis\\\"], ax[\\\"compare_status\\\"], sev)
        n = ax.get(\\\"notes\\\",\\\"\\\")
        if n:
            try: nd=json.loads(n); print(\\\"    conflicts:\\\",nd.get(\\\"conflicts\\\",[])); print(\\\"    matches:\\\",nd.get(\\\"matches\\\",[])[:2])
            except: print(\\\"    notes:\\\",str(n)[:200])
\"; echo; done'"
          echo ""

          echo "=== CONFIG: model + image_gen provider ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'grep -E \"default:|provider:|model:|BOTJI_IMAGE_MODEL|BOTJI_VISION|BOTJI_CODEX\" /opt/data/config.yaml 2>/dev/null | head -20; echo ---; env | grep -E \"BOTJI_IMAGE|BOTJI_VISION|BOTJI_CODEX\" 2>/dev/null || true'"
          echo ""

          echo "=== TELEGRAM_ALLOWED_USERS ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'echo TELEGRAM_ALLOWED_USERS=\$TELEGRAM_ALLOWED_USERS; echo GATEWAY_ALLOW_ALL_USERS=\$GATEWAY_ALLOW_ALL_USERS; echo TELEGRAM_BOT_USERNAME=\$TELEGRAM_BOT_USERNAME'"
          echo ""

          echo "=== CONTAINER STATUS + UPTIME ==="
          $SSH "$HOST" "docker inspect botji-hermes --format='Started: {{.State.StartedAt}}  Status: {{.State.Health.Status}}' 2>/dev/null"
          echo ""

          echo "=== CODEX + AUTH STATUS ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'codex --version 2>&1; echo ---; head -c 120 /opt/data/auth.json 2>/dev/null; echo'"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event.inputs.action == 'deploy')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Write CI vars file
        run: |
          {
            echo "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'"
            echo "GHCR_USER='${{ github.actor }}'"
            echo "IMAGE_REF='ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}'"
            echo "GIT_BRANCH='${{ github.ref_name }}'"
            echo "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'"
            echo "CI_TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'"
            echo "CI_TELEGRAM_BOT_USERNAME='${{ secrets.TELEGRAM_BOT_USERNAME }}'"
          } > /tmp/ci-vars.env
          printf '%s' "${{ secrets.VPS_ENV }}" | base64 > /tmp/vps-env.b64
          # Codex auth — written separately so it never appears in .env
          printf '%s' "${{ secrets.CODEX_AUTH_B64 }}" > /tmp/codex-auth.b64

      - name: Deploy via SSH
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          # Copy files to server
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/vps-deploy.sh /tmp/ci-vars.env /tmp/vps-env.b64 /tmp/codex-auth.b64 \
            "$HOST:/tmp/"

          # Run deploy
          $SSH "$HOST" "chmod +x /tmp/vps-deploy.sh && bash /tmp/vps-deploy.sh"
