id: blocked_receipt
description: a receipt with status=block carries through the primary_blocker into the gate.
inputs:
  files:
    source: source-bytes
    output: output-bytes
  steps:
    - tool: source_register
      args:
        path: $path:source
        current_turn_id: turn-a
        role: source
        declared_type: text
      save_as: src
    - tool: artifact_write
      args:
        path: $path:output
        parents:
          - $src.artifact_id
        current_turn_id: turn-a
        claim_level: reviewed
      save_as: out
    - tool: receipt_record
      args:
        source_ids:
          - $src.artifact_id
        output_id: $out.artifact_id
        route: harness
        status: block
        primary_blocker: semantic_review_failed
        current_turn_id: turn-a
      save_as: rcpt
    - tool: delivery_gate
      args:
        receipt_id: $rcpt.receipt_id
expected:
  delivery_gate: blocked
  primary_blocker: semantic_review_failed
