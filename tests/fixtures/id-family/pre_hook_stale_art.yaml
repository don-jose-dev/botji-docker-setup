id: pre_hook_stale_art
description: |
  pre_tool_call hook rejects an art_* ID whose registry record was tagged
  with a different current_turn_id than the call. Today this is only caught
  by the post-review backstop in botji-artifacts/_guardrails.py; the hook
  blocks the bad call before the tool ever dispatches.
inputs:
  scenario: pre_hook_stale_art
expected:
  pre_hook: block
  message_contains: "Stale source ID"
