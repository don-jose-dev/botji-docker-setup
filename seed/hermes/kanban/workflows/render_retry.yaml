# Render-retry workflow — durable orchestration for source-bound render + review + 1 retry.
#
# Why this lives here
#   The retry loop for `review_record(delivery_gate="blocked")` used to be
#   prose-only inside botji-2d-to-3d / botji-codex-engineering. That meant the
#   retry intent was lost on container restart or session compaction.
#
#   Hermes Kanban is the durable multi-step primitive. Tasks carry
#   `current_step_key` so workflows resume from where they stopped. The kernel
#   columns `workflow_template_id` and `current_step_key` are present from
#   v1 (see C:/Dev/hermes-agent/hermes_cli/kanban_db.py lines 841-845) — the
#   v1 kernel writes them but doesn't yet consult them for routing (forward-
#   compat). This template ships *now* so:
#     - the skill-following agent can point at it as the canonical source of
#       truth for "which steps run, in what order, with what gate";
#     - when Kanban v2 lands and the dispatcher starts routing by template,
#       there's no migration — the file is already on disk.
#
# Schema status
#   Upstream Hermes does not yet ship a workflow-template file format. The
#   shape below is forward-compat: top-level metadata + an ordered `steps`
#   list keyed by `key`, each step naming the tool/operation it runs and the
#   transition conditions. If upstream v2 lands with a different shape, this
#   file is rewritten — the contract surface is "skill reads template; kernel
#   reads template eventually." No external code consumes it yet beyond the
#   skill instructions and the deterministic harness fixture.
#
# Retry budget
#   The canonical cap is `1 attempt + 1 retry` per turn, defined in
#   `botji-render-mode` (Retry budget). This template encodes exactly that
#   shape — `step_review_initial` and `step_review_retry` are the two gates;
#   `step_ask_user` is the human-handoff after the second block.

id: render_retry_v1
name: Source-bound render retry
description: |
  Run an `operation_run` against a registered source artifact, review
  against the manifest, and on `delivery_gate == "blocked"` retry once with
  prior_blocker + adjacency-first subject_inventory. After two blocked reviews
  on the same constraint, hand off to the user.

# Match criteria — when the agent should pick this template.
#
# The agent decides; the kernel does not yet route on these. Keep them as
# documented matchers so future v2 dispatcher routing has them ready.
applies_when:
  - source_artifact_registered: true
  - operation: edit_image
  - flow: source_bound_render

# Retry shape, declarative. Mirrors `botji-render-mode` Retry budget.
budget:
  max_transforms: 2     # canonical 1 + 1
  max_reviews: 2
  on_double_block: ask_user

steps:
  - key: step_extract_manifest
    description: |
      Run `evidence_extract_manifest(artifact_id=source_id)` to populate
      `manifest` + `fidelity_requirements`. Falls back to hand-written
      manifest from SKILL.md Step 0 if Codex is unavailable.
    tool: evidence_extract_manifest
    on_success: step_transform_initial
    on_failure: step_transform_initial   # fall through; agent uses hand manifest

  - key: step_transform_initial
    description: |
      First `operation_run(operation="edit_image", ...)` with the full
      manifest-driven brief — subject_inventory, hard_preserve, and
      forbidden_elements derived per SKILL.md Step 2.
    tool: operation_run
    operation: edit_image
    on_success: step_review_initial
    on_failure: step_ask_user           # transform itself failed → no retry, escalate

  - key: step_review_initial
    description: |
      `review_record(source_artifact_ids, output_artifact_id, fidelity_requirements)`.
      Inspects against the spatial manifest.
    tool: review_record
    transitions:
      - when: delivery_gate == "clear"
        next: step_deliver
      - when: delivery_gate == "warn"
        next: step_deliver
      - when: delivery_gate == "blocked"
        next: step_retry_transform

  - key: step_retry_transform
    description: |
      Retry with both escalations combined into one call:
        - `prior_blocker = review["primary_blocker"]` (verbatim) added as the
          FIRST FORBIDDEN entry.
        - `subject_inventory` rewritten with the adjacency constraint moved
          to position 0 (adjacency-first).
      Do not run a second cosmetic retry — both moves go into this single call.
    tool: operation_run
    operation: edit_image
    inputs:
      prior_blocker: ${step_review_initial.result.primary_blocker}
      retry_guidance: ${step_review_initial.result.retry_guidance}
      subject_inventory_strategy: adjacency_first
    on_success: step_review_retry
    on_failure: step_ask_user

  - key: step_review_retry
    description: |
      Second and final review pass. If still blocked on the same constraint,
      the workflow escalates to `step_ask_user`.
    tool: review_record
    transitions:
      - when: delivery_gate == "clear"
        next: step_deliver
      - when: delivery_gate == "warn"
        next: step_deliver
      - when: delivery_gate == "blocked"
        next: step_ask_user

  - key: step_deliver
    description: |
      Pass the delivery_gate, send the artifact, and persist a `receipt_record`
      so the delivery is auditable per `delivery-ownership-contract`.
    tool: receipt_record
    terminal: true
    outcome: completed

  - key: step_ask_user
    description: |
      Surface the conflict per SKILL.md Step 5. The exact prompt is:
        "I've made 2 attempts. The closest result I could produce conflicts
        on: [primary_blocker]. Options: (1) accept this result, (2) adjust
        the sketch, (3) try a different camera angle."
      Never silently run a third transform. The kanban task transitions to
      `blocked` with a structured reason payload, and a gateway notifier
      relays the message back to the originating chat.
    tool: kanban_block
    inputs:
      reason: render_retry_double_block
    terminal: true
    outcome: blocked

# Fallback contract — IMPORTANT.
#
# If a tenant has `kanban.dispatch_in_gateway` off (config.yaml) OR the kanban
# DB is unreachable, the skill-following agent runs the same shape INLINE
# (skill behavior unchanged) — see SKILL.md Step 5 in botji-2d-to-3d. The
# template is the durable orchestration layer; the prose is the always-on
# fallback.
fallback:
  mode: inline_retry
  reason: |
    Kanban dispatch is off or unreachable. Run the same 1+1 shape directly
    from the skill prose. No durability across container restarts, but the
    retry semantics are identical.
