name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - logs

concurrency:
  group: botji-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: don-jose-dev/botji-hermes

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Extract SBOM from pushed image
        # buildx attaches the SBOM as an OCI referrer to the image (sbom: true
        # above). The previous template `{{ json (index .SBOM "linux/amd64").SPDX }}`
        # fails because `imagetools inspect` exposes the SBOM as a stub (not an
        # indexable map) until the platform key is selected via `--sbom`. The
        # supported shape is `--sbom --format '{{ json .SBOM.SPDX }}'`, which
        # only emits the SPDX document for the inspected image's platform. The
        # image is single-platform (linux/amd64) so this is enough.
        id: sbom
        continue-on-error: true
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          mkdir -p sbom
          docker buildx imagetools inspect \
            "$image" \
            --format '{{ json .SBOM.SPDX }}' \
            > sbom/botji-hermes.spdx.json
          # Sanity-check: SPDX docs always have an spdxVersion field.
          grep -q '"spdxVersion"' sbom/botji-hermes.spdx.json
          echo "sbom-path=sbom/botji-hermes.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.version }}
          path: sbom/botji-hermes.spdx.json
          retention-days: 90
          if-no-files-found: warn

  logs:
    name: Fetch container logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'
    permissions:
      contents: read

    steps:
      - name: Set up SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if ssh-keyscan -T 10 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
                break
              fi
              sleep 5
            done
          fi
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch logs
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local n=1
            until "$@"; do
              local exit_code=$?
              if [ "$n" -ge "$attempts" ]; then
                echo "ERROR: command failed after $n attempts: $*" >&2
                return "$exit_code"
              fi
              echo "WARN: command failed ($exit_code), retry $n/$attempts in ${delay}s: $*" >&2
              sleep "$delay"
              n=$((n + 1))
            done
          }

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          HOST="${VPS_USER}@${VPS_HOST}"

          retry 8 15 ssh "${SSH_OPTS[@]}" "$HOST" "echo ssh-ok"
          retry 5 15 scp "${SSH_OPTS[@]}" scripts/vps-diag.sh "$HOST:/tmp/vps-diag.sh"
          retry 3 20 ssh "${SSH_OPTS[@]}" "$HOST" "chmod +x /tmp/vps-diag.sh && bash /tmp/vps-diag.sh"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event.inputs.action == 'deploy')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            for attempt in 1 2 3 4 5; do
              if ssh-keyscan -T 10 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
                break
              fi
              sleep 5
            done
          fi
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Write CI vars file
        env:
          DEPLOY_PATH_SECRET: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER_VALUE: ${{ github.actor }}
          GHCR_TOKEN_SECRET: ${{ github.token }}
          IMAGE_REF_VALUE: ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}
          GIT_BRANCH_VALUE: ${{ github.ref_name }}
          TELEGRAM_BOT_TOKEN_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME_SECRET: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          VPS_ENV_SECRET: ${{ secrets.VPS_ENV }}
          CODEX_AUTH_B64_SECRET: ${{ secrets.CODEX_AUTH_B64 }}
          BOTJI_IMAGE_MODEL_SECRET: ${{ secrets.BOTJI_IMAGE_MODEL }}
          BOTJI_CODEX_IMAGE_CHAT_MODEL_SECRET: ${{ secrets.BOTJI_CODEX_IMAGE_CHAT_MODEL }}
          BOTJI_VISION_REVIEW_MODEL_SECRET: ${{ secrets.BOTJI_VISION_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          : > /tmp/ci-vars.env
          write_var() {
            local key="$1"
            local value="${2:-}"
            printf '%s=%q\n' "$key" "$value" >> /tmp/ci-vars.env
          }

          write_var DEPLOY_PATH "$DEPLOY_PATH_SECRET"
          write_var GHCR_USER "$GHCR_USER_VALUE"
          write_var IMAGE_REF "$IMAGE_REF_VALUE"
          write_var GIT_BRANCH "$GIT_BRANCH_VALUE"
          write_var GHCR_TOKEN "$GHCR_TOKEN_SECRET"
          write_var CI_TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN_SECRET"
          write_var CI_TELEGRAM_BOT_USERNAME "$TELEGRAM_BOT_USERNAME_SECRET"
          write_var CI_IMAGE_MODEL "$BOTJI_IMAGE_MODEL_SECRET"
          write_var CI_CODEX_IMAGE_CHAT_MODEL "$BOTJI_CODEX_IMAGE_CHAT_MODEL_SECRET"
          write_var CI_VISION_REVIEW_MODEL "$BOTJI_VISION_REVIEW_MODEL_SECRET"

          printf '%s' "$VPS_ENV_SECRET" | base64 -w 0 > /tmp/vps-env.b64
          printf '%s' "$CODEX_AUTH_B64_SECRET" > /tmp/codex-auth.b64
          chmod 600 /tmp/ci-vars.env /tmp/vps-env.b64 /tmp/codex-auth.b64

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local n=1
            until "$@"; do
              local exit_code=$?
              if [ "$n" -ge "$attempts" ]; then
                echo "ERROR: command failed after $n attempts: $*" >&2
                return "$exit_code"
              fi
              echo "WARN: command failed ($exit_code), retry $n/$attempts in ${delay}s: $*" >&2
              sleep "$delay"
              n=$((n + 1))
            done
          }

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          HOST="${VPS_USER}@${VPS_HOST}"

          retry 8 15 ssh "${SSH_OPTS[@]}" "$HOST" "echo ssh-ok"
          # vps-deploy.sh is a thin wrapper that sources sibling deploy*.sh
          # modules from the same directory (resolved via BASH_SOURCE). The
          # whole set must land in /tmp/ together — shipping vps-deploy.sh
          # alone would leave it unable to source deploy.sh.
          retry 5 15 scp "${SSH_OPTS[@]}" \
            scripts/vps-deploy.sh \
            scripts/deploy.sh \
            scripts/deploy-env.sh \
            scripts/deploy-config.sh \
            scripts/deploy-tenants.sh \
            scripts/deploy-smoke.sh \
            /tmp/ci-vars.env /tmp/vps-env.b64 /tmp/codex-auth.b64 \
            "$HOST:/tmp/"
          retry 3 30 ssh "${SSH_OPTS[@]}" "$HOST" \
            "chmod +x /tmp/vps-deploy.sh && bash /tmp/vps-deploy.sh"
