id: vocab_reject_bad_type
description: |
  Pydantic rejects an Element whose `type` is not in the ElementType
  controlled vocabulary. C2's emission must produce only typed entries —
  this fixture proves the gate exists.
inputs:
  scenario: pydantic_validate
  typed_manifest:
    version: v2
    scene_type: kitchen_interior
    source_modality: sketch
    elements:
      - element_id: thing_01
        type: spaceship_module
        zone: back_wall
        required: true
        status: visible
        evidence: ""
    adjacency_constraints: []
    opening_constraints: []
    layout_hints: []
    fidelity_requirements: []
expected:
  pydantic_valid: false
  failing_field_contains: type
