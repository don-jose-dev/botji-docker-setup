id: roundtrip_wardrobe_with_doors
description: |
  Larger v1 manifest with adjacency + opening constraints survives the
  v1 → v2 → v1 round-trip. Opening constraints map their wall_or_side
  (v1) to the typed zone enum, and back to wall_or_side. element_count
  must equal len(elements) after every conversion.
inputs:
  scenario: roundtrip
  v1_manifest:
    scene_type: wardrobe_interior
    source_modality: floor_plan
    elements:
      - id: elem_1
        label: drawer unit
        wall_or_zone: left_wall
        position_index: 1
        notes: ""
      - id: elem_2
        label: hanging rail
        wall_or_zone: left_wall
        position_index: 2
        notes: ""
      - id: elem_3
        label: shoe rack
        wall_or_zone: back_wall
        position_index: 1
        notes: ""
      - id: elem_4
        label: mirror panel
        wall_or_zone: right_wall
        position_index: 1
        notes: ""
      - id: elem_5
        label: door
        wall_or_zone: front_wall
        position_index: 1
        notes: ""
    element_count: 5
    adjacency_constraints:
      - elem_a: elem_1
        elem_b: elem_2
        relation: directly_adjacent
        wall_or_zone: left_wall
    opening_constraints:
      - element_id: elem_5
        room_or_zone: bedroom
        opening_type: door
        wall_or_side: front_wall
        position_on_wall: center
        swing_or_handing: opens inward left-hand
        notes: ""
    layout_hints: ["L-shape layout", "3 walls of fitted units"]
    fidelity_requirements:
      - "Total element count: exactly 5 units"
      - "Drawer unit is directly adjacent to hanging rail on left wall"
expected:
  element_count_preserved: true
  layout_hints_preserved: true
  fidelity_requirements_preserved: true
  zones_preserved: true
  adjacency_count_preserved: true
  opening_count_preserved: true
