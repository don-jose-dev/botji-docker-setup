name: CI

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  plugin-smoke:
    name: Plugin smoke + lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plugin runtime dependencies
        # Mirror the Dockerfile install set so import-time deps resolve correctly.
        # Heavy optionals (pymupdf/ezdxf) only need to be importable, not exercised.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pillow \
            pymupdf \
            pypdf \
            ezdxf \
            python-magic \
            jsonschema \
            pydantic \
            openai

      - name: Compile-check every plugin module
        # py_compile catches syntax errors before runtime; cheap and deterministic.
        run: |
          python -m compileall -q seed/hermes/plugins/

      - name: Enforce botji-core LOC cap
        # botji-core is the "thin substrate" promised by docs/HERMES_NATIVE_REWRITE_PLAN.md.
        # The LOC cap lives in docs/BOTJI_CORE_CHARTER.md (single source of truth), so
        # raising it always shows up as a charter edit in the PR diff — making the
        # "mechanical vs semantic" tradeoff visible at review time.
        run: |
          charter=docs/BOTJI_CORE_CHARTER.md
          [ -f "$charter" ] || { echo "::error::$charter is missing — restore it before merging"; exit 1; }
          cap=$(sed -n 's/.*BOTJI_CORE_LOC_CAP:\s*\([0-9]\+\).*/\1/p' "$charter" | head -n1)
          [ -n "$cap" ] || { echo "::error::could not parse BOTJI_CORE_LOC_CAP from $charter"; exit 1; }
          loc=$(find seed/hermes/plugins/botji-core -name '*.py' -not -path '*/__pycache__/*' -exec cat {} + | wc -l)
          echo "botji-core LOC: $loc / cap: $cap"
          if [ "$loc" -gt "$cap" ]; then
            echo "::error::botji-core LOC ($loc) exceeds cap ($cap). Raise BOTJI_CORE_LOC_CAP in $charter and document why — see the charter."
            exit 1
          fi

      - name: Run plugin smoke test
        # Imports every submodule of every botji-* plugin, exercises each plugin
        # entry point, verifies public symbols.  Same script + contract that runs
        # as the pre-flight gate in vps-deploy.sh.
        run: |
          chmod +x scripts/smoke-plugin.sh
          PLUGINS_ROOT="$(pwd)/seed/hermes/plugins" \
            bash scripts/smoke-plugin.sh

      - name: Check for unused imports (ruff F401)
        # Catches dead imports left over from refactors before they reach master.
        run: |
          python -m pip install --quiet ruff
          ruff check seed/hermes/plugins/ --select F401,F841 --output-format concise

      - name: Compile-check every runtime script
        run: |
          for f in runtime/bin/botji-*; do
            python -m py_compile "$f" 2>/dev/null || echo "  skip $f (non-Python)"
          done

  skill-eval:
    name: Skill-interaction evals (deterministic)
    # workflow_dispatch only — fixtures use mock_trace for now, not real agent
    # runs, so this is a hand-triggered check rather than an auto-blocking gate.
    # Becomes auto when the LLM-judge tier lands and traces come from real runs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run deterministic skill-interaction evals
        run: |
          python evals/skill_interactions/run_evals.py

  shell-lint:
    name: Shell scripts shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck on deploy + smoke scripts
        # Fail on real bugs (error+warning); style (info/style) is informational.
        # The deploy script is single point of failure for production — keep it clean.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            scripts/vps-deploy.sh \
            scripts/deploy.sh \
            scripts/deploy-env.sh \
            scripts/deploy-config.sh \
            scripts/deploy-tenants.sh \
            scripts/deploy-smoke.sh \
            scripts/vps-postdeploy-smoke.sh \
            scripts/smoke-plugin.sh \
            scripts/server-setup.sh

      - name: Lint Dockerfile (hadolint)
        # Catches common Dockerfile mistakes before the full Docker build runs in
        # deploy.yml — avoids 5-minute build failures on trivially fixable issues.
        run: |
          docker run --rm -i hadolint/hadolint hadolint \
            --ignore DL3008 --ignore DL3009 --ignore DL3015 \
            - < Dockerfile
