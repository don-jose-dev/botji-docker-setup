id: stale_art_block
description: |
  Failure mode 3: the reply names an art_* source whose current_turn_id is
  older than the latest registered source's turn. The most-recent receipt
  cited under that output_id passes (so modes 1 and 2 do not fire), but the
  art_ lineage is stale — hook MUST replace the reply with the stale-lineage
  message, mentioning the offending art_ ID.
inputs:
  response_text: |
    Sketch mode · route: edit_image · claim: reviewed · art_20260520T080000Z_deadbeef
  receipts:
    - receipt_id: rcpt_20260522T120200Z_11223344
      output_id: art_20260520T080000Z_deadbeef
      source_ids: [art_20260520T080000Z_deadbeef]
      route: edit_image
      status: pass
      current_turn_id: turn-current
      created_at: "2026-05-22T12:02:00Z"
  sources:
    - artifact_id: src_20260522T115500Z_99999999
      current_turn_id: turn-current
      kind: source
      role: source
      created_at: "2026-05-22T11:55:00Z"
  legacy_artifacts:
    - artifact_id: art_20260520T080000Z_deadbeef
      role: source
      current_turn_id: turn-old
      created_at: "2026-05-20T08:00:00Z"
expected:
  contains: stale lineage art_20260520T080000Z_deadbeef
  not_contains: "claim: reviewed"
