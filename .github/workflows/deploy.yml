name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: don-jose-dev/botji-hermes

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/botji' }}
          VPS_ENV: ${{ secrets.VPS_ENV }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            GHCR_USER="$GHCR_USER" \
            IMAGE_TAG="$IMAGE_TAG" \
            GIT_BRANCH="$GIT_BRANCH" \
            VPS_ENV="$(printf '%s' "$VPS_ENV" | base64 -w0)" \
            'bash -s' << '"DEPLOY"'
            set -e

            cd "$DEPLOY_PATH"

            echo "==> GHCR login"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --stdin

            echo "==> Pull latest code"
            git pull origin "$GIT_BRANCH"

            echo "==> Write .env"
            if [ -n "$VPS_ENV" ]; then
              printf '%s' "$VPS_ENV" | base64 -d > .env
              chmod 600 .env
            fi

            echo "==> Pull image: $IMAGE_TAG"
            BOTJI_PROD_IMAGE="$IMAGE_TAG" docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml pull

            echo "==> Reload"
            BOTJI_PROD_IMAGE="$IMAGE_TAG" make reload

            echo "==> Smoke check"
            sleep 8
            STATUS=$(docker inspect botji-hermes --format='{{.State.Health.Status}}' 2>/dev/null || echo "not found")
            echo "Container status: $STATUS"
            [ "$STATUS" = "healthy" ] && echo "Deploy complete." || { echo "WARN: Not healthy yet ($STATUS)"; exit 1; }
          DEPLOY
