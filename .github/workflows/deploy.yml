name: Build and Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        default: 'deploy'
        type: choice
        options:
          - deploy
          - logs

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: don-jose-dev/botji-hermes

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  logs:
    name: Fetch container logs
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'logs'
    permissions:
      contents: read

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch logs
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          echo "=== FULL HERMES LOGS (last 300 lines) ==="
          $SSH "$HOST" "docker logs botji-hermes --tail 300 2>&1"
          echo ""
          echo "=== CODEX AUTH FILE CHECK ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'ls -la /opt/data/.codex/ 2>&1; echo ---; echo CODEX_HOME=\$CODEX_HOME; echo ---; [ -f /opt/data/.codex/auth.json ] && echo auth.json exists, size=\$(stat -c%s /opt/data/.codex/auth.json) bytes || echo auth.json MISSING; echo ---; head -c 60 /opt/data/.codex/auth.json 2>&1 || true; echo'"
          echo ""
          echo "=== HERMES TOPLEVEL HELP ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'hermes --help 2>&1 | head -50'"
          echo ""
          echo "=== HERMES AUTH HELP (verbose) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'hermes auth 2>&1 | head -40; echo ---; hermes auth --help 2>&1 | head -40'"
          echo ""
          echo "=== HERMES SOURCE: where auth is looked up ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'grep -rIn --include=\"*.py\" -E \"auth\\.json|codex_credentials|No Codex credentials\" /opt/hermes 2>/dev/null | head -30'"
          echo ""
          echo "=== HERMES USER PASSWD ENTRY ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'getent passwd hermes; getent passwd 10000; echo \"HOME64=\$(echo -n \$HOME | base64)\"'"
          echo ""
          echo "=== HERMES PROCESS HOME + ENV ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'echo HOME=\$HOME; echo HERMES_HOME=\$HERMES_HOME; echo USER=\$(whoami); echo UID=\$(id -u)'"
          echo ""
          echo "=== ALL AUTH.JSON FILES IN CONTAINER ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'find / -name auth.json 2>/dev/null | head -20'"
          echo ""
          echo "=== /opt/data TREE (top 3 levels) ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'find /opt/data -maxdepth 3 -type f 2>/dev/null | head -40'"
          echo ""
          echo "=== HERMES HOME OR .hermes DIR ==="
          $SSH "$HOST" "docker exec botji-hermes bash -c 'ls -la ~/.hermes/ 2>&1 || echo no_dotfile_hermes; ls -la /opt/data/.hermes 2>&1 || echo no_opt_dotfile_hermes; ls -la \$HOME 2>&1 | head -20'"
          echo ""
          echo "=== ALL DOCKER CONTAINERS ON VPS ==="
          $SSH "$HOST" "docker ps -a"
          echo ""
          echo "=== ALL DOCKER IMAGES ==="
          $SSH "$HOST" "docker images | head -20"
          echo ""
          echo "=== SYSTEMD BOTJI SERVICES ==="
          $SSH "$HOST" "systemctl list-units '*botji*' --all --no-pager 2>&1 || true"
          echo ""
          echo "=== PROCESSES USING THE BOT TOKEN ==="
          $SSH "$HOST" "ps auxf | grep -iE 'hermes|telegram|gateway' | grep -v grep || echo 'no host hermes processes'"
          echo ""
          echo "=== TELEGRAM_BOT_TOKEN ENTRIES IN .env (last 8 chars only) ==="
          $SSH "$HOST" "cd /opt/botji && grep TELEGRAM_BOT_TOKEN .env | sed 's/.*\(.\{8\}\)$/...\1/'"
          echo ""
          echo "--- CODEX STATUS ---"
          $SSH "$HOST" "docker exec botji-hermes bash -c 'codex --version 2>&1' 2>&1 || echo CODEX_EXEC_FAILED"

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event.inputs.action == 'deploy')
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Write CI vars file
        run: |
          {
            echo "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'"
            echo "GHCR_USER='${{ github.actor }}'"
            echo "IMAGE_REF='ghcr.io/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}'"
            echo "GIT_BRANCH='${{ github.ref_name }}'"
            echo "GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}'"
            echo "CI_TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}'"
            echo "CI_TELEGRAM_BOT_USERNAME='${{ secrets.TELEGRAM_BOT_USERNAME }}'"
          } > /tmp/ci-vars.env
          printf '%s' "${{ secrets.VPS_ENV }}" | base64 > /tmp/vps-env.b64
          # Codex auth — written separately so it never appears in .env
          printf '%s' "${{ secrets.CODEX_AUTH_B64 }}" > /tmp/codex-auth.b64

      - name: Deploy via SSH
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes"
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"

          # Copy files to server
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/vps-deploy.sh /tmp/ci-vars.env /tmp/vps-env.b64 /tmp/codex-auth.b64 \
            "$HOST:/tmp/"

          # Run deploy
          $SSH "$HOST" "chmod +x /tmp/vps-deploy.sh && bash /tmp/vps-deploy.sh"
