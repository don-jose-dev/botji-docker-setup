name: botji-core
version: 0.2.0
description: "Thin Hermes-native Botji source, artifact, receipt, and delivery gate substrate. Exposes Prometheus metrics."
author: Botji
kind: standalone
requires_env: []
provides_tools:
  - source_register
  - source_current
  - artifact_write
  - receipt_record
  - delivery_gate
provides_hooks:
  - pre_tool_call
  - post_tool_call
