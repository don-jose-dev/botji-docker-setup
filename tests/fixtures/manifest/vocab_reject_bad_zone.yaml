id: vocab_reject_bad_zone
description: |
  Pydantic rejects an Element whose `zone` is not in the Zone controlled
  vocabulary. A common pattern: callers pasting "left side" or "ceiling
  beam" instead of the canonical enum value. The schema makes this
  impossible at the type layer.
inputs:
  scenario: pydantic_validate
  typed_manifest:
    version: v2
    scene_type: kitchen_interior
    source_modality: sketch
    elements:
      - element_id: countertop_01
        type: countertop
        zone: left side
        required: true
        status: visible
        evidence: ""
    adjacency_constraints: []
    opening_constraints: []
    layout_hints: []
    fidelity_requirements: []
expected:
  pydantic_valid: false
  failing_field_contains: zone
