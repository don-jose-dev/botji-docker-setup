name: CI

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  plugin-smoke:
    name: Plugin smoke + lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install plugin runtime dependencies
        # Mirror the Dockerfile install set so import-time deps resolve correctly.
        # Heavy optionals (pymupdf/ezdxf) only need to be importable, not exercised.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pillow \
            pymupdf \
            pypdf \
            ezdxf \
            python-magic \
            jsonschema \
            openai

      - name: Compile-check every plugin module
        # py_compile catches syntax errors before runtime; cheap and deterministic.
        run: |
          python -m compileall -q seed/hermes/plugins/

      - name: Run plugin smoke test
        # Imports every submodule of every botji-* plugin, exercises each plugin
        # entry point, verifies public symbols.  Same script + contract that runs
        # as the pre-flight gate in vps-deploy.sh.
        run: |
          chmod +x scripts/smoke-plugin.sh
          PLUGINS_ROOT="$(pwd)/seed/hermes/plugins" \
            bash scripts/smoke-plugin.sh

      - name: Check for unused imports (ruff F401)
        # Catches dead imports left over from refactors before they reach master.
        run: |
          python -m pip install --quiet ruff
          ruff check seed/hermes/plugins/ --select F401,F841 --output-format concise

      - name: Compile-check every runtime script
        run: |
          for f in runtime/bin/botji-*; do
            python -m py_compile "$f" 2>/dev/null || echo "  skip $f (non-Python)"
          done

      - name: Run deterministic behavior harnesses
        run: |
          python runtime/bin/botji-allowlist-harness \
            --plugin-path seed/hermes/plugins/botji-allowlist/__init__.py
          python runtime/bin/botji-gate-harness \
            --plugin-path seed/hermes/plugins/botji-gate/__init__.py
          python runtime/bin/botji-fidelity-guard-harness \
            --plugin-root seed/hermes/plugins/botji-artifacts
          python runtime/bin/botji-log-budget \
            --gateway-log /tmp/missing-gateway.log \
            --agent-log /tmp/missing-agent.log \
            --allow-empty \
            --max-response-seconds 180

  shell-lint:
    name: Shell scripts shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck on deploy + smoke scripts
        # Fail on real bugs (error+warning); style (info/style) is informational.
        # The deploy script is single point of failure for production — keep it clean.
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning \
            scripts/vps-deploy.sh \
            scripts/smoke-plugin.sh \
            scripts/server-setup.sh \
            scripts/smoke-tenants.sh \
            scripts/vps-postdeploy-smoke.sh \
            scripts/vps-rotate-sessions.sh

      - name: Run tenant isolation smoke
        run: |
          cat > /tmp/botji-a.env <<'EOF'
          BOTJI_TENANT_ID=botji
          BOTJI_DATA_DIR=./data/botji
          BOTJI_WORKSPACE_DIR=./workspace-botji
          BOTJI_IMAGE_NAME=botji/hermes-codex
          BOTJI_IMAGE_TAG=local
          TELEGRAM_BOT_TOKEN=111:aaa
          HERMES_API_PORT=8642
          HERMES_DASHBOARD_PORT=9119
          API_SERVER_KEY=dummy-a
          BOTJI_CODEX_IMAGE_CHAT_MODEL=gpt-5.4-mini
          BOTJI_VISION_REVIEW_MODEL=gpt-5.4-mini
          EOF
          cat > /tmp/degain.env <<'EOF'
          BOTJI_TENANT_ID=degain
          BOTJI_DATA_DIR=./data/degain
          BOTJI_WORKSPACE_DIR=./workspace-degain
          BOTJI_IMAGE_NAME=botji/hermes-codex
          BOTJI_IMAGE_TAG=local
          TELEGRAM_BOT_TOKEN=222:bbb
          HERMES_API_PORT=8643
          HERMES_DASHBOARD_PORT=9120
          API_SERVER_KEY=dummy-b
          BOTJI_CODEX_IMAGE_CHAT_MODEL=gpt-5.4-mini
          BOTJI_VISION_REVIEW_MODEL=gpt-5.4-mini
          EOF
          bash scripts/smoke-tenants.sh /tmp/botji-a.env /tmp/degain.env

      - name: Lint Dockerfile (hadolint)
        # Catches common Dockerfile mistakes before the full Docker build runs in
        # deploy.yml — avoids 5-minute build failures on trivially fixable issues.
        run: |
          docker run --rm -i hadolint/hadolint hadolint \
            --ignore DL3008 --ignore DL3009 --ignore DL3015 \
            - < Dockerfile
