id: secret_redaction
description: |
  Secret-shaped substrings in the result_summary must be redacted before
  the audit line is written. Conservative regex patterns: tok_*, sk_*,
  Bearer <token>, JWT prefix eyJ*. The audit log is not a secret-exfil
  channel — when in doubt the redactor drops the substring.
inputs:
  tenant: t-redact
  tool_name: output_write
  tool_call_id: tc-redact-1
  session_id: session-redact
  args:
    path: /tmp/out.png
    parents: [src_001]
    current_turn_id: turn-redact
  # The result text deliberately mimics output that could carry secrets — an
  # upstream API echoing a bearer token, a JWT, or an OpenAI-style sk_ key.
  # All four redaction patterns appear so the JSONL must contain none.
  result:
    success: true
    note: "auth: Bearer sk_live_AKIAQQQQQQQQQQ77 token=tok_abcDEF123 jwt=eyJhbGciOiJIUzI1NiIs"
expected:
  record_count: 1
  result_status: success
  session_id: session-redact
  args_hash_present: true
  summary_includes_redaction: true
  summary_excludes:
    - sk_live_AKIAQQQQQQQQQQ77
    - tok_abcDEF123
    - eyJhbGciOiJIUzI1NiIs
    - "Bearer sk_"
